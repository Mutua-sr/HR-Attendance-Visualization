<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Workforce Analytics — Sign In</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f8f7f4;--sf:#fff;--s2:#f1efe8;--bd:rgba(0,0,0,0.09);
  --tx:#1a1a18;--tx2:#5f5e5a;--tx3:#888780;--tx4:#b4b2a9;
  --ac:#185fa5;--abg:#e6f1fb;
  --da:#a32d2d;--dbg:#fcebeb;--da2:#f7c1c1;
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--tx);font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
}

/* subtle dot grid matching the warm off-white bg */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,var(--bd) 1px,transparent 1px);
  background-size:24px 24px;pointer-events:none;opacity:.6;
}

.login-wrap{
  background:var(--sf);border:.5px solid var(--bd);
  border-radius:var(--r);padding:36px 32px 32px;
  width:100%;max-width:380px;
  box-shadow:0 4px 24px rgba(0,0,0,.07);
  position:relative;
  animation:up .3s cubic-bezier(.22,.68,0,1.15) both;
}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.brand-icon{
  width:36px;height:36px;border-radius:8px;
  background:var(--ac);display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.brand-name{font-size:13px;font-weight:600;letter-spacing:-.2px;line-height:1.3;}
.brand-name span{color:var(--ac);}
.brand-sub{font-size:10px;color:var(--tx3);margin-top:1px;}

h1{font-size:16px;font-weight:600;margin-bottom:4px;}
.sub{font-size:11px;color:var(--tx3);margin-bottom:24px;}

.field{margin-bottom:12px;}
label{display:block;font-size:10px;font-weight:600;color:var(--tx3);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
input[type=text],input[type=password]{
  width:100%;padding:7px 10px;
  border:.5px solid var(--bd);border-radius:var(--rs);
  font-size:12px;background:var(--sf);color:var(--tx);
  outline:none;transition:border-color .15s,box-shadow .15s;
  font-family:inherit;
}
input[type=text]:focus,input[type=password]:focus{
  border-color:var(--ac);
  box-shadow:0 0 0 3px var(--abg);
}
input::placeholder{color:var(--tx4);}

.btn-login{
  width:100%;padding:8px;margin-top:4px;
  background:var(--ac);color:#fff;border:none;
  border-radius:var(--rs);font-size:12px;font-weight:600;
  cursor:pointer;transition:opacity .15s,transform .1s;
  font-family:inherit;letter-spacing:.2px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:34px;
}
.btn-login:hover{opacity:.9;}
.btn-login:active{transform:scale(.98);}
.btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.spinner{
  width:13px;height:13px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;
  animation:spin .6s linear infinite;display:none;
}
@keyframes spin{to{transform:rotate(360deg);}}
.btn-login.loading .btn-text{display:none;}
.btn-login.loading .spinner{display:block;}

.err{
  display:none;
  background:var(--dbg);border:.5px solid var(--da2);
  border-radius:var(--rs);padding:7px 10px;
  font-size:11px;color:var(--da);margin-bottom:12px;
  animation:shake .25s ease;
}
.err.show{display:block;}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}

.footer{
  margin-top:22px;padding-top:16px;
  border-top:.5px solid var(--bd);
  font-size:10px;color:var(--tx4);text-align:center;line-height:1.6;
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="brand">
    <div class="brand-icon">📊</div>
    <div>
      <div class="brand-name">Workforce <span>Analytics</span></div>
      <div class="brand-sub">Example Organisation</div>
    </div>
  </div>

  <h1>Sign in</h1>
  <p class="sub">Enter your credentials to continue</p>

  <div class="err" id="err"></div>

  <div class="field">
    <label for="uname">Username</label>
    <input id="uname" type="text" placeholder="username" autocomplete="username" autofocus>
  </div>
  <div class="field">
    <label for="pw">Password</label>
    <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="loginBtn" onclick="doLogin()">
    <span class="btn-text">Sign in</span>
    <div class="spinner"></div>
  </button>

  <div class="footer">
    Session ends when you close the tab · Contact admin to reset credentials
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  if (authGetUser()) window.location.href = 'index.html';

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('err');
    const username = document.getElementById('uname').value.trim();
    const password = document.getElementById('pw').value;

    err.classList.remove('show');
    if (!username || !password) {
      err.textContent = 'Please enter both username and password.';
      err.classList.add('show'); return;
    }

    btn.classList.add('loading'); btn.disabled = true;
    const ok = await authLogin(username, password);
    btn.classList.remove('loading'); btn.disabled = false;

    if (ok) {
      window.location.href = 'index.html';
    } else {
      err.textContent = 'Incorrect username or password.';
      err.classList.add('show');
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  }
</script>
</body>
</html>
